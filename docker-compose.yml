version: "3.9"

services:
  discord-radio:
    build: .
    container_name: sl-radio-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Optional: limit resource usage
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
